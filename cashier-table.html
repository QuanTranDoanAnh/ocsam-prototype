<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Thu ngân · iOcOrder (prototype)</title>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/proto.css" />
  </head>
  <body>
    <script src="assets/data.js"></script>
    <script src="assets/proto.js"></script>
    <script>
      // /cashier with one table chosen: CheckoutScreen.tsx (list + Detail) with DiscountPanel, QrCode, PaymentPanel,
      // SplitSheet, and the shared CancelSheet, ReturnSheet, TableMoveSheet, ApprovalChoices, PrintAlerts; ShiftStrip above.
      const D = P.D;
      const tableId = P.param('table', 'S1');
      const main = P.frame({ surface: 'cashier', user: 'cashier', title: 'Thu ngân' });
      const esc = P.esc;
      const money = P.money;

      /* ---------- sample data used only by the cashier pages (consistent with data.js) ---------- */
      const METHODS = [
        { id: 'cash', name: 'Tiền mặt' },
        { id: 'transfer', name: 'Chuyển khoản' },
        { id: 'card', name: 'Thẻ ngân hàng' },
        { id: 'zalopay', name: 'ZaloPay' },
        { id: 'viettel_money', name: 'Viettel Money' },
        { id: 'other', name: 'Khác' },
      ];
      const CANCEL_REASONS = [
        ['customer_cancels', 'Khách hủy món'],
        ['customer_changes', 'Khách đổi món'],
        ['staff_error', 'Nhân viên nhập nhầm'],
        ['out_of_stock', 'Hết nguyên liệu'],
        ['long_wait', 'Chờ lâu'],
        ['customer_unhappy', 'Khách không hài lòng'],
        ['other', 'Lý do khác'],
      ];
      const APPROVERS = ['Phạm Quốc Huy', 'Lương Thị Mai'];
      const SELF_CANCEL_GROUPS = ['bia', 'nuoc']; // groups whose printed items staff may cancel themselves
      const NEXT_BILL = 'HĐ-0032';

      /* ---------- helpers ---------- */
      const transferContent = (billNo, table) =>
        `${billNo} ${table}`.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'D').toUpperCase();
      const typed = (n) => (n === null || n === '' ? '' : P.num(n));
      const digits = (s) => (String(s).replace(/\D/g, '') === '' ? null : Number(String(s).replace(/\D/g, '').slice(0, 13)));
      const errorBlock = (p) => `<div role="alert" class="status status-danger"><strong>${esc(p.cause)}</strong>${esc(p.remedy)}</div>`;
      /** Largest-remainder allocation of a discount over line amounts (exact, integer VND). */
      function allocate(total, amounts) {
        const sum = amounts.reduce((a, b) => a + b, 0);
        if (sum === 0) return amounts.map(() => 0);
        const raw = amounts.map((a) => (total * a) / sum);
        const out = raw.map(Math.floor);
        let left = total - out.reduce((a, b) => a + b, 0);
        raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => {
          if (left > 0) (out[i]++, left--);
        });
        return out;
      }
      /** A QR-like picture of the payload (the real app draws the VietQR modules; black on white in both themes). */
      function qrSvg(payload, label) {
        const n = 29;
        let h = 2166136261;
        for (const c of payload) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
        const rnd = () => ((h = Math.imul(h ^ (h >>> 13), 1274126177)), ((h >>> 0) % 100) / 100);
        const finder = (r, c) =>
          [[0, 0], [0, n - 7], [n - 7, 0]].some(([fr, fc]) => r >= fr - 1 && r <= fr + 7 && c >= fc - 1 && c <= fc + 7);
        const finderDark = (r, c) =>
          [[0, 0], [0, n - 7], [n - 7, 0]].some(([fr, fc]) => {
            const y = r - fr, x = c - fc;
            if (y < 0 || x < 0 || y > 6 || x > 6) return false;
            return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
          });
        let d = '';
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++) {
            const dark = finder(r, c) ? finderDark(r, c) : r === 6 || c === 6 ? (r + c) % 2 === 0 : rnd() < 0.48;
            if (dark) d += `M${c + 4} ${r + 4}h1v1h-1z`;
          }
        const size = n + 8;
        return `<svg class="qr" role="img" aria-label="${esc(label)}" viewBox="0 0 ${size} ${size}" width="240" height="240" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="white"/><path d="${d}" fill="black"/></svg>`;
      }

      /* ---------- the table ---------- */
      const table = P.table(tableId) ?? P.table('S1');
      const s = P.session(table.id);
      const area = P.area(table.area);
      const lines = s.lines
        .map((l, i) => ({ ...l, i, item: P.item(l.code) }))
        .filter((l) => l.state !== 'cancelled');
      const existingBill = s.bill ? D.bills.find((b) => b.no === s.bill) : null;

      const st = {
        printed: existingBill ? { no: existingBill.no, total: existingBill.total } : null,
        entries: s.discount
          ? [{ code: s.discount.programme, name: s.discount.name, level: 'bill', percent: 10, rule: '10%' }]
          : [],
        asking: false,
        note: null,
        discountProblem: null,
        manual: { level: 'bill', target: '', kind: 'percent', value: '', reason: '', problem: null },
        pay: [],
      };

      /** Works out each entry's amount and each line's discount (one source per line). */
      function discounts() {
        const perLine = new Map();
        const amounts = st.entries.map((e) => {
          const target = lines.filter((l) =>
            e.level === 'bill' ? true : e.level === 'group' ? l.item.group === e.target : l.code === e.target,
          );
          const base = target.map((l) => P.lineAmount(l));
          const sum = base.reduce((a, b) => a + b, 0);
          const total = e.percent !== undefined ? Math.round((sum * e.percent) / 100) : Math.min(e.amount, sum);
          allocate(total, base).forEach((v, k) => perLine.set(target[k].i, { code: e.code, amount: v }));
          return total;
        });
        const gross = lines.reduce((a, l) => a + P.lineAmount(l), 0);
        const discount = amounts.reduce((a, b) => a + b, 0);
        return { perLine, amounts, gross, discount, payable: gross - discount };
      }

      /* ---------- the page frame: tabs, shift strip, print alert, list ---------- */
      const sh = D.shifts[0];
      const shiftClosed = P.param('shift') === 'closed';
      const cashIn = D.bills
        .filter((b) => b.method === 'cash')
        .reduce((a, b) => a + (b.state === 'cancelled' ? 0 : b.total), 0); // a cancelled cash bill: paid, then refunded
      const expected = sh.opening + cashIn;

      const rows = D.tables
        .filter((t) => t.session && t.state !== 'empty')
        .map((t) => {
          const ss = P.session(t.id);
          const b = ss.bill ? D.bills.find((x) => x.no === ss.bill) : null;
          return { t, total: b ? b.total : P.sessionDue(ss) };
        });

      main.insertAdjacentHTML(
        'beforeend',
        `<div class="actions" role="group" aria-label="Thu ngân">
          <button type="button" aria-pressed="true">Thanh toán</button>
          <button type="button" class="secondary" aria-pressed="false" data-go="cashier-bills.html">Tra cứu hóa đơn</button>
        </div>
        ${shiftStripHtml()}
        <section role="alert" aria-label="Phiếu bếp không in được" class="status status-danger print-alert">
          <strong>Trạm Nướng không in được phiếu</strong>
          <span>Bàn S3: Ốc giác nướng mỡ hành × 1 (máy in hết giấy).</span>
          <div class="actions">
            <button type="button" data-toast="Đã gửi lệnh in lại phiếu Nướng">In lại</button>
            <button type="button" class="secondary" data-toast="Đã xử lý">Đã xử lý</button>
          </div>
        </section>
        <div class="checkout">
          <section aria-labelledby="checkout-list-title" class="checkout-list">
            <h2 id="checkout-list-title">Bàn chờ thanh toán</h2>
            <ul aria-label="Danh sách bàn chờ thanh toán" class="checkout-rows">
              ${rows
                .map(
                  (r) => `<li><button type="button" class="checkout-row" aria-pressed="${r.t.id === table.id}" data-go="cashier-table.html?table=${r.t.id}">
                    <span class="checkout-code">Bàn ${r.t.id}</span>
                    <span class="muted">${esc(P.area(r.t.area).name)}</span>
                    <span class="chip chip-state">${P.TABLE_STATE[r.t.state]}</span>
                    <span class="money">${money(r.total)}</span>
                  </button></li>`,
                )
                .join('')}
            </ul>
          </section>
          <section aria-live="polite" class="checkout-detail" id="detail"></section>
        </div>
        ${dialogsHtml()}`,
      );

      function shiftStripHtml() {
        if (shiftClosed)
          return `<section aria-labelledby="shift-title" class="shift-strip">
            <h3 id="shift-title">Ca làm việc</h3>
            <div class="actions" id="shift-none">
              <p><strong>Chưa mở ca</strong> <span class="muted">Mở ca nếu bạn muốn đếm tiền đầu ca và cuối ca. Việc bán hàng không cần mở ca.</span></p>
              <button type="button" id="shift-open-btn">Mở ca</button>
            </div>
            <form id="shift-open-form" hidden>
              <div class="field">
                <label for="shift-window">Ca</label>
                <select id="shift-window">${D.shifts.map((x) => `<option>${esc(x.name)}</option>`).join('')}</select>
              </div>
              <div class="field">
                <label for="shift-opening">Tiền đầu ca</label>
                <input id="shift-opening" inputmode="numeric" autocomplete="off" />
                <div class="denominations" role="group" aria-label="Số tiền hay dùng">
                  ${[0, 500000, 1000000, 2000000].map((v) => `<button type="button" class="secondary" data-start="${v}">${money(v)}</button>`).join('')}
                </div>
              </div>
              <div class="actions">
                <button type="button" data-toast="Ca chiều, bạn mở lúc ${D.premise.now}" data-go="${location.pathname.split('/').pop()}?table=${table.id}">Mở ca</button>
                <button type="button" class="secondary" id="shift-open-cancel">Thôi</button>
              </div>
            </form>
          </section>`;
        return `<section aria-labelledby="shift-title" class="shift-strip">
          <h3 id="shift-title">Ca làm việc</h3>
          <p role="status">Ca ${esc(sh.name.replace(/^Ca /, ''))}, bạn mở lúc ${sh.opened}</p>
          <div class="actions"><button type="button" data-open="dlg-shift-close">Đóng ca</button></div>
        </section>`;
      }

      function dialogsHtml() {
        return `
        <dialog id="dlg-shift-close" class="proto-sheet" aria-labelledby="dlg-shift-close-title">
          <h2 id="dlg-shift-close-title">Đóng ca</h2>
          <p class="muted">Ca ${esc(sh.name.replace(/^Ca /, ''))}, bạn mở lúc ${sh.opened}</p>
          <div class="field">
            <label for="shift-closing">Tiền đếm cuối ca</label>
            <input id="shift-closing" inputmode="numeric" autocomplete="off" value="${P.num(3850000)}" />
          </div>
          <div class="actions">
            <button type="button" id="shift-close-count">Đóng ca và đếm tiền</button>
            <button type="button" class="secondary" data-close data-open="dlg-shift-nocount">Đóng ca không đếm tiền</button>
            <button type="button" class="secondary" data-close>Thôi</button>
          </div>
        </dialog>
        <dialog id="dlg-shift-result" class="proto-sheet" aria-label="Kết quả đóng ca">
          <div role="status" class="status status-ok shift-result">
            <strong>Kết quả đóng ca</strong>
            <dl>
              <dt>Tiền đầu ca</dt><dd>${money(sh.opening)}</dd>
              <dt>Tiền cần có</dt><dd>${money(expected)}</dd>
              <dt>Tiền đã đếm</dt><dd id="shift-counted"></dd>
              <dt>Chênh lệch</dt><dd><strong id="shift-diff"></strong></dd>
            </dl>
            <p>Chỉ bạn thấy các số tiền này.</p>
            <button type="button" class="secondary" data-go="cashier.html?shift=closed">Xong</button>
          </div>
        </dialog>
        <dialog id="dlg-shift-nocount" class="proto-sheet" aria-label="Kết quả đóng ca">
          <div role="status" class="status status-ok shift-result">
            <strong>Kết quả đóng ca</strong>
            <p>Ca đã đóng, không đếm tiền.</p>
            <button type="button" class="secondary" data-go="cashier.html?shift=closed">Xong</button>
          </div>
        </dialog>
        <dialog id="dlg-cancel" class="proto-sheet"></dialog>
        <dialog id="dlg-return" class="proto-sheet"></dialog>
        <dialog id="dlg-move" class="proto-sheet"></dialog>
        <dialog id="dlg-split" class="proto-sheet" style="width:min(760px, calc(100vw - 32px))"></dialog>`;
      }

      /* ---------- the detail (CheckoutScreen › Detail) ---------- */
      const detail = document.getElementById('detail');

      function render() {
        const ds = discounts();
        const printed = st.printed;
        const lineHtml = lines
          .map((l) => {
            const d = ds.perLine.get(l.i);
            return `<li>
              <span>${P.qty(l.qty)} × ${esc(l.item.name)}${l.note ? `<small> · ${esc(l.note)}</small>` : ''}</span>
              <span class="money">${money(P.lineAmount(l))}</span>
              ${
                printed
                  ? ''
                  : `<button type="button" class="secondary row-action" aria-label="Trả món ${esc(l.item.name)}" data-act="return" data-line="${l.i}">Trả món</button>
                     <button type="button" class="secondary row-action" aria-label="Hủy món ${esc(l.item.name)}" data-act="cancel" data-line="${l.i}">Hủy món</button>`
              }
              ${d && d.amount > 0 ? `<small class="line-discount">Giảm ${esc(d.code)}: -${money(d.amount)}</small>` : ''}
            </li>`;
          })
          .join('');
        detail.innerHTML = `<div class="checkout-card">
          <h2>Bàn ${table.id}</h2>
          <p class="muted">${esc(area.name)} · ${esc(s.order)}</p>
          <ul aria-label="Các món của bàn" class="checkout-lines">${lineHtml}</ul>
          <p class="checkout-total"><strong>Tổng cộng</strong> <strong class="money">${money(printed ? printed.total : ds.payable)}</strong></p>
          ${
            printed
              ? ''
              : `<div class="actions">
                  <button type="button" class="secondary" data-act="cancel-table">Hủy cả bàn</button>
                  <button type="button" class="secondary" data-act="move">Chuyển / ghép bàn</button>
                  <button type="button" class="secondary" data-act="split">Chia hóa đơn</button>
                </div>`
          }
          ${st.note ? `<p role="status" class="muted">${esc(st.note)}</p>` : ''}
          ${printed ? '' : discountPanelHtml(ds)}
          ${printed ? '' : printActionsHtml(ds)}
          ${printed ? billBoxHtml() + '<section aria-labelledby="pay-title" class="payment" id="payment"></section>' : ''}
        </div>`;
        if (printed) renderPayment();
      }

      function printActionsHtml(ds) {
        return `<div class="actions">
          <button type="button" class="secondary" data-act="slip">In phiếu kiểm món</button>
          ${
            !st.asking
              ? `<button type="button" data-act="ask">In hóa đơn</button>`
              : `<div role="group" aria-label="Hóa đơn in ra là cuối cùng, không sửa được. In hóa đơn cho bàn này?" class="status status-warning">
                  <strong>Hóa đơn in ra là cuối cùng, không sửa được. In hóa đơn cho bàn này?</strong>
                  ${ds.discount > 0 ? `<span>Giảm giá: -${money(ds.discount)} · Phải thu: ${money(ds.payable)}</span>` : ''}
                  <div class="actions">
                    <button type="button" data-act="print">Đồng ý in hóa đơn</button>
                    <button type="button" class="secondary" data-act="unask">Quay lại</button>
                  </div>
                </div>`
          }
        </div>`;
      }

      function billBoxHtml() {
        const b = st.printed;
        const content = transferContent(b.no, table.id);
        return `<section aria-labelledby="bill-title" class="bill-box">
          <h3 id="bill-title">Hóa đơn ${esc(b.no)}</h3>
          <figure class="qr-figure">
            ${qrSvg(`${D.bank.account}|${b.total}|${content}`, `Mã QR chuyển khoản ${money(b.total)}`)}
            <figcaption>
              <strong>Mã VietQR chuyển khoản</strong>
              <span>${esc(D.bank.name)} · ${esc(D.bank.account)}</span>
              <span>${esc(D.bank.holder)}</span>
              <span>Số tiền: ${money(b.total)}</span>
              <span>Nội dung: ${esc(content)}</span>
            </figcaption>
          </figure>
          <div class="actions"><button type="button" class="secondary" data-act="reprint">In lại hóa đơn</button></div>
        </section>`;
      }

      /* ---------- DiscountPanel ---------- */
      const OFFERS = D.promotions.filter((p) => p.active && ['SINHNHAT10', 'KHACHQUEN50'].includes(p.code));
      function discountPanelHtml(ds) {
        const applied = st.entries.map((e) => e.code);
        const offers = OFFERS.filter((o) => !applied.includes(o.code));
        const mf = st.manual;
        const groups = [...new Map(lines.map((l) => [l.item.group, P.group(l.item.group).name])).entries()];
        const items = [...new Map(lines.map((l) => [l.code, l.item.name])).entries()];
        const targets = mf.level === 'group' ? groups : mf.level === 'item' ? items : [];
        const levels = { bill: 'Cả hóa đơn', group: 'Nhóm món', item: 'Một món' };
        return `<section aria-labelledby="discount-title" class="discount-panel">
          <h3 id="discount-title">Giảm giá</h3>
          <p class="muted">Mỗi món chỉ có một khuyến mại. Món nào có nhiều khuyến mại cùng áp dụng thì chọn một.</p>
          <div role="group" aria-label="Chương trình khuyến mại">
            <h4>Chương trình khuyến mại</h4>
            ${
              offers.length === 0
                ? '<p class="muted">Hiện không có chương trình nào để áp dụng.</p>'
                : `<ul class="offer-list">${offers
                    .map(
                      (o) => `<li><label class="check"><input type="checkbox" data-offer="${o.code}" aria-label="Áp dụng ${esc(o.code + ' ' + o.name)}" />
                        <span><strong>${esc(o.code)}</strong> ${esc(o.name)}<small> · ${esc(o.kind)}, đến ${o.to}</small></span></label></li>`,
                    )
                    .join('')}</ul>`
            }
          </div>
          <form class="manual-discount" aria-label="Giảm giá ngoài chương trình" id="manual-form">
            <h4>Giảm giá ngoài chương trình</h4>
            <p class="muted">Phải ghi lý do. Không giới hạn mức giảm; kế toán xem lại sau.</p>
            <div class="form-grid">
              <div class="field">
                <label for="md-level">Giảm cho</label>
                <select id="md-level" data-mf="level">${Object.entries(levels)
                  .map(([k, v]) => `<option value="${k}"${mf.level === k ? ' selected' : ''}>${v}</option>`)
                  .join('')}</select>
              </div>
              ${
                mf.level !== 'bill'
                  ? `<div class="field"><label for="md-target">Nhóm hoặc món</label>
                      <select id="md-target" data-mf="target"><option value="">…</option>${targets
                        .map(([id, name]) => `<option value="${id}"${mf.target === id ? ' selected' : ''}>${esc(name)}</option>`)
                        .join('')}</select></div>`
                  : ''
              }
              <div class="field">
                <label for="md-kind">Cách giảm</label>
                <select id="md-kind" data-mf="kind">
                  <option value="percent"${mf.kind === 'percent' ? ' selected' : ''}>Theo phần trăm</option>
                  <option value="amount"${mf.kind === 'amount' ? ' selected' : ''}>Theo số tiền</option>
                </select>
              </div>
              <div class="field">
                <label for="md-value">${mf.kind === 'percent' ? 'Phần trăm (%)' : 'Số tiền (đ)'}</label>
                <input id="md-value" data-mf="value" inputmode="decimal" autocomplete="off" value="${esc(mf.value)}" />
              </div>
              <div class="field">
                <label for="md-reason">Lý do</label>
                <input id="md-reason" data-mf="reason" autocomplete="off" value="${esc(mf.reason)}" />
              </div>
            </div>
            ${mf.problem ? `<p role="alert" class="status status-danger">${esc(mf.problem)}</p>` : ''}
            <div class="actions"><button type="submit" class="secondary">Thêm giảm giá</button></div>
          </form>
          ${st.discountProblem ? errorBlock(st.discountProblem) : ''}
          <div role="group" aria-label="Đang áp dụng">
            <h4>Đang áp dụng</h4>
            ${
              st.entries.length === 0
                ? '<p class="muted">Chưa áp dụng giảm giá nào.</p>'
                : `<ul class="applied-list">${st.entries
                    .map(
                      (e, k) => `<li><span><strong>${esc(e.code)}</strong> ${esc(e.name)} · ${levels[e.level]}${e.targetName ? ' ' + esc(e.targetName) : ''} · ${esc(e.rule)}${e.reason ? `<small> · ${esc(e.reason)}</small>` : ''}</span>
                        <span class="money">-${money(ds.amounts[k])}</span>
                        <button type="button" class="secondary" aria-label="Bỏ giảm giá ${esc(e.code)}" data-act="drop" data-k="${k}">Bỏ</button></li>`,
                    )
                    .join('')}</ul>`
            }
          </div>
          <dl class="discount-totals">
            <div><dt>Tạm tính</dt><dd class="money">${money(ds.gross)}</dd></div>
            <div><dt>Giảm giá</dt><dd class="money">-${money(ds.discount)}</dd></div>
            <div><dt>Phải thu</dt><dd class="money payable">${money(ds.payable)}</dd></div>
          </dl>
        </section>`;
      }

      const CONFLICT = {
        cause: 'Chưa áp dụng được giảm giá này.',
        remedy: 'Có thể chương trình đã hết hạn, đã được áp dụng, hoặc đã có giảm giá cả hóa đơn. Bỏ cái cũ rồi thử lại.',
      };
      /** One source per line: an entry may not touch a line another entry already discounts. */
      function addEntry(e) {
        const touches = (x) =>
          lines.filter((l) => (x.level === 'bill' ? true : x.level === 'group' ? l.item.group === x.target : l.code === x.target)).map((l) => l.i);
        const mine = touches(e);
        const clash = st.entries.some((x) => touches(x).some((i) => mine.includes(i)));
        if (clash) {
          st.discountProblem = CONFLICT;
          return false;
        }
        st.discountProblem = null;
        st.entries.push(e);
        return true;
      }

      /* ---------- PaymentPanel ---------- */

        if (st.pay.length === 0) st.pay = [{ key: 0, method: 'cash', amount: total, tendered: null }];
        const box = document.getElementById('payment');
        box.innerHTML = `<h3 id="pay-title">Ghi nhận thanh toán</h3>
          ${st.pay
            .map(
              (l, i) => `<div class="pay-line" role="group" aria-label="Ghi nhận thanh toán ${i + 1}">

                  ).join('')}</select>
                </div>
                <div class="field">
                  <label for="pa-${l.key}">Số tiền</label>
                  <input id="pa-${l.key}" data-pay="amount" data-key="${l.key}" inputmode="numeric" autocomplete="off" value="${typed(l.amount)}" />

                            .map((v) => `<button type="button" class="secondary" data-tender="${v}" data-key="${l.key}">${money(v)}</button>`)

                        <p role="status" class="change" id="change-${l.key}"></p>

                    : ''
                }
                ${st.pay.length > 1 ? `<button type="button" class="secondary" aria-label="Bỏ dòng ${i + 1}" data-act="pay-remove" data-key="${l.key}">Bỏ dòng</button>` : ''}
              </div>`,
            )
            .join('')}
          <div class="actions"><button type="button" class="secondary" id="pay-add" data-act="pay-add">Thêm hình thức</button></div>
          <p role="status" id="pay-balance"></p>
          <button type="button" class="send" id="pay-confirm" data-act="pay">Đã thanh toán</button>`;
        updatePayment();
      }
      function updatePayment() {
        const total = st.printed.total;
        const sum = st.pay.reduce((a, l) => a + (l.amount ?? 0), 0);
        const diff = total - sum;
        st.pay.forEach((l) => {
          const ch = document.getElementById(`change-${l.key}`);
          if (!ch) return;
          ch.innerHTML =
            l.tendered !== null && l.amount > 0 && l.tendered >= l.amount
              ? `<strong>Tiền thừa trả khách: ${money(l.tendered - l.amount)}</strong>`
              : '';
        });
        const bal = document.getElementById('pay-balance');
        bal.className = diff === 0 ? 'muted' : 'status status-warning';
        bal.textContent =
          diff === 0 ? 'Đủ số tiền của hóa đơn.' : diff > 0 ? `Còn thiếu: ${money(diff)}` : `Thừa: ${money(-diff)}`;
        document.getElementById('pay-add').disabled = diff <= 0;
        const valid =
          diff === 0 && st.pay.every((l) => l.amount > 0 && (l.tendered === null || l.tendered >= l.amount));
        document.getElementById('pay-confirm').disabled = !valid;
      }

          ${
            l
              ? `<div class="field"><label for="cancel-qty">Số lượng hủy</label>

          }
          // printed food: the server answers "an approval is needed" (S11)
          out.innerHTML = `${errorBlock({ cause: 'Món này đã in cho bếp nên chưa hủy được.', remedy: 'Nhờ quản lý hủy, hoặc duyệt giúp. Chưa có gì bị hủy.' })}

      /* ---------- TableMoveSheet ---------- */
      function openMove() {
        const dlg = document.getElementById('dlg-move');
        const modes = [
          ['table', 'Chuyển bàn', 'Cả bàn sang một bàn trống. Món, giá và số phiếu giữ nguyên.'],

          </fieldset>

          if (mode === 'merge' && st.entries.length) return bad('Bàn này đang có giảm giá. Bỏ giảm giá rồi ghép, sau đó giảm lại trên hóa đơn chung.');

      /* ---------- SplitSheet ---------- */
      function openSplit() {
        const dlg = document.getElementById('dlg-split');
        const sp = { mode: '', groups: 2, parts: '2', cells: {} };
        const qtyOf = (l, g) => {
          const n = Number(String(sp.cells[l.i]?.[g] ?? '').replace(',', '.'));
          return Number.isFinite(n) && n > 0 ? n : 0;
        };
        const draw = () => {
          const ds = discounts();
          const groupTotals = Array.from({ length: sp.groups }, (_, g) =>
            lines.reduce((a, l) => a + Math.round(qtyOf(l, g) * l.price), 0),
          );
          const left = (l) => Math.round((l.qty - Array.from({ length: sp.groups }, (_, g) => qtyOf(l, g)).reduce((a, b) => a + b, 0)) * 100) / 100;
          const over = lines.some((l) => left(l) < 0);
          const unalloc = lines.some((l) => left(l) > 0);
          const emptyGroup = groupTotals.some((t, g) => lines.every((l) => qtyOf(l, g) === 0));
          const reason = over ? 'Có món chia quá số lượng hiện có.' : unalloc ? 'Còn món chưa chia vào nhóm nào.' : emptyGroup ? 'Mỗi nhóm cần ít nhất một món.' : null;
          const n = Number(sp.parts);
          const partsOk = Number.isInteger(n) && n >= 2 && n <= 20;
          const payable = ds.payable;
          const shares = partsOk ? Array.from({ length: n }, (_, k) => Math.floor(payable / n) + (k < payable % n ? 1 : 0)) : [];
          const canConfirm = sp.mode === 'items' ? reason === null : sp.mode === 'share' ? partsOk : false;
          const modes = {
            items: ['Chia theo món', 'Chia món và số lượng vào từng nhóm. Mỗi nhóm một hóa đơn.'],
            share: ['Chia đều', 'Chia tổng tiền thành các phần bằng nhau (lẻ vài đồng dồn vào các phần đầu).'],
          };
          const focusId = document.activeElement?.id;
          dlg.innerHTML = `<form class="cancel-sheet split-sheet" aria-label="Chia hóa đơn bàn ${table.id}">
            <h3>Chia hóa đơn bàn ${table.id}</h3>
            <fieldset class="reasons"><legend>Cách chia</legend>
              ${Object.entries(modes)
                .map(([k, [name, help]]) => `<label class="check"><input type="radio" name="split-mode" value="${k}"${sp.mode === k ? ' checked' : ''} /><span>${name}<small> · ${help}</small></span></label>`)
                .join('')}
            </fieldset>
            ${
              sp.mode === 'items'
                ? `<div class="table-scroll"><table class="split-grid">
                    <thead><tr><th scope="col">Món</th>${groupTotals.map((_, g) => `<th scope="col">Nhóm ${g + 1}</th>`).join('')}<th scope="col">Còn lại</th></tr></thead>
                    <tbody>${lines
                      .map(
                        (l) => `<tr><th scope="row">${esc(l.item.name)} <small>× ${P.qty(l.qty)}</small></th>
                          ${groupTotals.map((_, g) => `<td><input id="cell-${l.i}-${g}" data-cell="${l.i}" data-g="${g}" inputmode="decimal" autocomplete="off" aria-label="Số lượng ${esc(l.item.name)} cho nhóm ${g + 1}" value="${esc(sp.cells[l.i]?.[g] ?? '')}" /></td>`).join('')}
                          <td><span>${P.qty(left(l))}</span> <button type="button" class="secondary row-action" data-all="${l.i}" aria-label="Dồn hết vào nhóm 1: ${esc(l.item.name)}">Dồn hết vào nhóm 1</button></td></tr>`,
                      )
                      .join('')}</tbody>
                    <tfoot><tr><th scope="row">Tổng từng nhóm</th>${groupTotals.map((t, g) => `<td><strong class="money" aria-label="Tổng nhóm ${g + 1}">${money(t)}</strong></td>`).join('')}<td></td></tr></tfoot>
                  </table></div>
                  <p>Cộng các nhóm: <strong class="money">${money(groupTotals.reduce((a, b) => a + b, 0))}</strong> · Tổng cả bàn: <strong class="money">${money(ds.gross)}</strong></p>
                  <div class="actions">
                    <button type="button" class="secondary" data-sp="add"${sp.groups >= 20 ? ' disabled' : ''}>Thêm nhóm</button>
                    <button type="button" class="secondary" data-sp="remove"${sp.groups <= 2 ? ' disabled' : ''}>Bớt nhóm cuối</button>
                  </div>
                  ${reason ? `<p role="status" class="status status-warning">${reason}</p>` : ''}`
                : ''
            }
            ${
              sp.mode === 'share'
                ? `<div class="field"><label for="split-parts">Số phần</label><input id="split-parts" inputmode="numeric" autocomplete="off" value="${esc(sp.parts)}" /></div>
                  <p class="muted">Giảm giá của bàn đã nằm trong tổng. Muốn đổi giảm giá, làm trước khi chia.</p>
                  <p>Tổng cả bàn: <strong class="money">${money(payable)}</strong></p>
                  <ul aria-label="Cách chia">${shares.map((x, k) => `<li>Phần ${k + 1}: ${money(x)}</li>`).join('')}</ul>`
                : ''
            }
            <div id="split-problem"></div>
            <div class="actions">
              <button type="submit"${canConfirm ? '' : ' disabled'}>Xác nhận chia</button>
              <button type="button" class="secondary" data-close>Quay lại</button>
            </div>
          </form>`;
          if (focusId) {
            const el = document.getElementById(focusId);
            if (el) {
              el.focus();
              if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length);
            }
          }
        };
        dlg.oninput = (e) => {
          const t = e.target;
          if (t.dataset.cell !== undefined) {
            (sp.cells[t.dataset.cell] ??= [])[Number(t.dataset.g)] = t.value;
            draw();
          } else if (t.id === 'split-parts') {
            sp.parts = t.value;
            draw();
          }
        };
        dlg.onchange = (e) => {
          if (e.target.name === 'split-mode') {
            sp.mode = e.target.value;
            draw();
          }
        };
        dlg.onclick = (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.dataset.sp === 'add') (sp.groups++, draw());
          if (b.dataset.sp === 'remove') (sp.groups--, Object.values(sp.cells).forEach((r) => (r.length = Math.min(r.length, sp.groups))), draw());
          if (b.dataset.all !== undefined) {
            const l = lines.find((x) => x.i === Number(b.dataset.all));
            sp.cells[l.i] = Array.from({ length: sp.groups }, (_, g) => (g === 0 ? P.qty(l.qty) : ''));
            draw();
          }
        };
        dlg.onsubmit = (e) => {
          e.preventDefault();
          if (sp.mode === 'items' && st.entries.length) {
            dlg.querySelector('#split-problem').innerHTML = errorBlock({
              cause: 'Bàn đang có giảm giá.',
              remedy: 'Bỏ giảm giá rồi chia theo món; sau đó cho từng hóa đơn giảm giá riêng. Hoặc chia đều.',
            });
            return;
          }
          dlg.close();
          P.toast(`Đã chia hóa đơn bàn ${table.id}`);
        };
        draw();
        dlg.showModal();
      }

      /* ---------- wiring ---------- */
      detail.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act],[data-tender]');
        if (!b) return;
        if (b.dataset.tender) {
          const l = st.pay.find((x) => x.key === Number(b.dataset.key));
          l.tendered = b.dataset.tender === 'exact' ? l.amount : Number(b.dataset.tender);
          return renderPayment();
        }
        const act = b.dataset.act;
        if (act === 'cancel') return openCancel(Number(b.dataset.line));
        if (act === 'cancel-table') return openCancel(null);
        if (act === 'return') return openReturn(Number(b.dataset.line));
        if (act === 'move') return openMove();
        if (act === 'split') return openSplit();
        if (act === 'slip') st.note = 'Đã gửi lệnh in phiếu kiểm món.';
        if (act === 'reprint') st.note = 'Đã gửi lệnh in lại hóa đơn.';
        if (act === 'ask') st.asking = true;
        if (act === 'unask') st.asking = false;
        if (act === 'print') {
          st.printed = { no: NEXT_BILL, total: discounts().payable };
          st.asking = false;
          P.toast(`Đã in hóa đơn ${NEXT_BILL}`);
        }
        if (act === 'drop') (st.entries.splice(Number(b.dataset.k), 1), (st.discountProblem = null));
        if (act === 'pay-add') {
          const diff = st.printed.total - st.pay.reduce((a, l) => a + (l.amount ?? 0), 0);
          const used = st.pay.map((l) => l.method);
          st.pay.push({ key: payKey++, method: (METHODS.find((m) => !used.includes(m.id)) ?? METHODS[0]).id, amount: Math.max(diff, 0), tendered: null });
          return renderPayment();
        }
        if (act === 'pay-remove') {
          st.pay = st.pay.filter((l) => l.key !== Number(b.dataset.key));
          return renderPayment();
        }
        if (act === 'pay') {
          const no = st.printed.no;
          P.toast(`Đã thanh toán ${no}. Bàn đã trống.`);
          setTimeout(() => (location.href = `cashier.html?paid=${encodeURIComponent(no)}&table=${table.id}`), 900);
          return;
        }
        render();
      });
      detail.addEventListener('change', (e) => {
        const t = e.target;
        if (t.dataset.offer) {
          const o = D.promotions.find((p) => p.code === t.dataset.offer);
          const e2 =
            o.code === 'KHACHQUEN50'
              ? { code: o.code, name: o.name, level: 'bill', amount: 50000, rule: '50.000đ' }
              : { code: o.code, name: o.name, level: 'bill', percent: 10, rule: '10%' };
          addEntry(e2);
          return render();
        }
        if (t.dataset.mf) {
          st.manual[t.dataset.mf] = t.value;
          if (t.dataset.mf === 'level') st.manual.target = '';
          if (t.dataset.mf === 'level' || t.dataset.mf === 'kind') render();
        }
        if (t.dataset.pay === 'method') {
          const l = st.pay.find((x) => x.key === Number(t.dataset.key));
          l.method = t.value;
          l.tendered = null;
          renderPayment();
        }
      });
      detail.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.mf) st.manual[t.dataset.mf] = t.value;
        if (t.dataset.pay === 'amount' || t.dataset.pay === 'tendered') {
          const l = st.pay.find((x) => x.key === Number(t.dataset.key));
          const v = digits(t.value);
          l[t.dataset.pay] = t.dataset.pay === 'amount' ? (v ?? 0) : v;
          t.value = typed(v);
          updatePayment();
        }
      });
      detail.addEventListener('submit', (e) => {
        if (e.target.id !== 'manual-form') return;
        e.preventDefault();
        const mf = st.manual;
        const fail = { cause: 'Chưa áp dụng được.', remedy: 'Kiểm tra lại rồi bấm lại. Bấm lại không làm trùng giảm giá.' };
        if (mf.reason.trim() === '') mf.problem = 'Hãy ghi lý do giảm giá.';
        else {
          const num = mf.kind === 'percent' ? Number(mf.value.replace(',', '.')) : Number(mf.value.replace(/\D/g, ''));
          if (!Number.isFinite(num) || num <= 0 || (mf.kind === 'percent' && num > 100)) mf.problem = fail.cause;
          else if (mf.level !== 'bill' && mf.target === '') mf.problem = fail.cause;
          else {
            mf.problem = null;
            const targetName =
              mf.level === 'group' ? P.group(mf.target).name : mf.level === 'item' ? P.item(mf.target).name : '';
            const ok = addEntry({
              code: 'OTHER',
              name: 'Giảm giá ngoài chương trình',
              level: mf.level,
              target: mf.target,
              targetName,
              ...(mf.kind === 'percent' ? { percent: num, rule: `${P.qty(num)}%` } : { amount: num, rule: money(num) }),
              reason: mf.reason.trim(),
            });
            if (ok) (mf.value = ''), (mf.reason = '');
          }
        }
        render();
      });

      // ShiftStrip wiring
      document.getElementById('shift-open-btn')?.addEventListener('click', () => {
        document.getElementById('shift-none').hidden = true;
        document.getElementById('shift-open-form').hidden = false;
      });
      document.getElementById('shift-open-cancel')?.addEventListener('click', () => {
        document.getElementById('shift-none').hidden = false;
        document.getElementById('shift-open-form').hidden = true;
      });
      document.querySelectorAll('[data-start]').forEach((b) =>
        b.addEventListener('click', () => (document.getElementById('shift-opening').value = typed(Number(b.dataset.start)))),
      );
      document.getElementById('shift-close-count')?.addEventListener('click', () => {
        const counted = digits(document.getElementById('shift-closing').value) ?? 0;
        const diff = counted - expected;
        document.getElementById('shift-counted').textContent = money(counted);
        document.getElementById('shift-diff').textContent =
          diff === 0 ? 'Khớp' : diff < 0 ? `Thiếu ${P.num(-diff)}` : `Thừa ${P.num(diff)}`;
        document.getElementById('dlg-shift-close').close();
        document.getElementById('dlg-shift-result').showModal();
      });
      document.getElementById('shift-closing')?.addEventListener('input', (e) => (e.target.value = typed(digits(e.target.value))));
      document.getElementById('shift-opening')?.addEventListener('input', (e) => (e.target.value = typed(digits(e.target.value))));

      render();
    </script>
  </body>
</html>
