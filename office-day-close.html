<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Chốt ngày · iOcOrder (prototype)</title>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/proto.css" />
  </head>
  <body>
    <script src="assets/data.js"></script>
    <script src="assets/proto.js"></script>
    <script>
      // /office/day-close: DayCloseScreen (ReconcileScreens.tsx, ADR-028): the immutable packages the premise closed at 07:00
      // and sent up, each with its checksum. ?day=2026-11-25 opens one package (the day with a refund and a bill unpaid at close).
      const as = P.param('as', 'accountant');
      const main = P.frame({ surface: 'office', user: as, title: 'Chốt ngày', nav: 'dayClose' });
      const D = P.D;
      const iso = (dmy) => dmy.split('/').reverse().join('-');
      const next = (dmy) => `${String(+dmy.slice(0, 2) + 1).padStart(2, '0')}${dmy.slice(2)}`;
      const sales = Object.fromEntries(D.salesByDay.map((s) => [`${s.day}/2026`, s]));

      // what each package holds beyond P.D.dayCloses (inline): checksum, received time, refunds, open items at close
      const extra = {
        '26/11/2026': { checksum: '9f3c1a7e52b04d8e', received: '07:00:41', refunded: 0, unpaid: [], open: [] },
        '25/11/2026': {
          checksum: '4be0d29a8c16f375', received: '07:01:12', refunded: 52000,
          unpaid: [{ billNo: 'HĐ-0058', table: 'L3', total: 1248000 }], open: [],
        },
        '24/11/2026': { checksum: 'c71e8b3f0a945d26', received: '07:00:38', refunded: 0, unpaid: [], open: [] },
      };
      const list = D.dayCloses.map((c) => ({ ...c, ...extra[c.day], iso: iso(c.day) }));
      const picked = P.param('day');
      const pkg = list.find((c) => c.iso === picked);

      function detail(c) {
        const s = sales[c.day];
        const methods = [
          ['Tiền mặt', Math.round((c.revenue * 0.43) / 1000) * 1000, c.refunded],
          ['Chuyển khoản', Math.round((c.revenue * 0.49) / 1000) * 1000, 0],
        ];
        methods.push(['Thẻ', c.revenue - methods[0][1] - methods[1][1], 0]);
        return `<section aria-label="Gói chốt ngày ${c.iso}">
          <h3>Gói chốt ngày ${c.iso}</h3>
          <dl class="summary-list">
            <div><dt>Đã thanh toán</dt><dd>${c.bills} · <span class="money">${P.money(c.revenue)}</span></dd></div>
            <div><dt>Giảm giá</dt><dd>${P.money(s ? s.discount : 0)}</dd></div>
            <div><dt>Hoàn tiền</dt><dd>${P.money(c.refunded)}</dd></div>
            <div><dt>Không thu được</dt><dd>${P.money(0)}</dd></div>
          </dl>
          <ul aria-label="Theo hình thức thanh toán">
            ${methods.map(([n, v, r]) => `<li>${n}: ${P.money(v)}${r > 0 ? ` (hoàn ${P.money(r)})` : ''}</li>`).join('')}
          </ul>
          ${
            c.unpaid.length
              ? `<h4>In hóa đơn nhưng chưa thu khi chốt (${c.unpaid.length})</h4>
                 <ul>${c.unpaid.map((u) => `<li>${u.billNo} · Bàn ${u.table} · ${P.money(u.total)}</li>`).join('')}</ul>`
              : ''
          }
          ${
            c.open.length
              ? `<h4>Bàn còn mở khi chốt (${c.open.length})</h4>
                 <ul>${c.open.map((o) => `<li>Bàn ${o.table} · ${o.orderNo} · ${P.money(o.total)}</li>`).join('')}</ul>`
              : ''
          }
          <p><button type="button" class="secondary" data-toast="Đã tải day-close-${c.iso}.xlsx">Tải Excel</button></p>
        </section>`;
      }

      main.insertAdjacentHTML(
        'beforeend',
        `<div class="field premise"><label for="premise">Cơ sở</label><output id="premise">${P.esc(D.premise.name)}</output></div>
        <section aria-labelledby="close-title">
          <h2 id="close-title">Chốt ngày</h2>
          <p class="muted">Cơ sở tự chốt mỗi ngày kinh doanh sau giờ chốt và gửi gói chốt lên đây. Gói không sửa được; mã kiểm tra cho biết gói còn nguyên.</p>
          <div class="table-scroll short" tabindex="0" role="region" aria-label="Các ngày đã chốt">
            <table class="data">
              <thead><tr><th scope="col">Ngày</th><th scope="col">Đã thanh toán</th><th scope="col">In rồi chưa thu</th><th scope="col">Bàn còn mở</th>
                <th scope="col">Nhận lúc</th><th scope="col">Mã kiểm tra</th></tr></thead>
              <tbody>${list
                .map(
                  (c) => `<tr>
                    <th scope="row"><button type="button" class="link-button" aria-pressed="${c === pkg}" aria-label="Xem gói chốt ngày ${c.iso}"
                      data-go="office-day-close.html?day=${c.iso}${as !== 'accountant' ? `&as=${as}` : ''}">${c.iso}</button></th>
                    <td>${c.bills} · ${P.money(c.revenue)}</td>
                    <td>${c.unpaid.length}</td>
                    <td>${c.open.length}</td>
                    <td>${c.received} ${next(c.day)}</td>
                    <td><code>${c.checksum.slice(0, 12)}</code></td>
                  </tr>`,
                )
                .join('')}</tbody>
            </table>
          </div>
          ${pkg ? detail(pkg) : ''}
        </section>`,
      );
    </script>
  </body>
</html>
