<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Trạm in và máy in · iOcOrder (prototype)</title>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/proto.css" />
  </head>
  <body>
    <script src="assets/data.js"></script>
    <script src="assets/proto.js"></script>
    <script>
      // /office/printers: PrintersScreen.tsx (StationsSection + StationFormPanel, PrintersSection + PrinterFormPanel).
      // Prototype addition: the printer fault from the premise health (S22) is shown on the printer's row; the app
      // shows faults on /order/health and the owner's live page, not on this screen.
      const main = P.frame({ surface: 'office', user: 'accountant', title: 'Trạm in và máy in', nav: 'printers' });
      const D = P.D;
      const fault = (name) => D.health.printers.find((h) => h.name === name && h.state === 'fault');
      const printers = [
        ...D.stations.map((s) => {
          const [brand, model] = s.printer.split(' – ')[1].split(/ (.+)/);
          return { id: s.id, name: `Máy in ${s.name}`, health: s.name, brand, model, ip: s.ip, cut: 'full', placement: s.name === 'Bar' ? 'Quầy bar' : `Trạm ${s.name}` };
        }),
        { id: 'tn', name: 'Máy in Thu ngân', health: 'Thu ngân', brand: 'Epson', model: 'TM-T82III', ip: D.billPrinter.ip, cut: 'partial', placement: 'Quầy thu ngân' },
      ];
      printers[0].backup = 'tn'; // Bếp falls back to the cashier's printer
      printers[1].backup = 'bep'; // Nướng falls back to Bếp
      const stations = D.stations.map((s) => ({ id: s.id, name: s.name, printer: s.id, mode: s.id === 'bar' ? 'round' : 'line' }));
      const MODES = { line: 'Mỗi món một phiếu', round: 'Mỗi lần gửi một phiếu' };
      const CUTS = { full: 'Cắt hết', partial: 'Cắt chừa' };
      const pname = (id) => printers.find((p) => p.id === id)?.name ?? '';
      const $ = (id) => document.getElementById(id);
      const opts = (list, v) => list.map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${P.esc(l)}</option>`).join('');
      const buttons = '<div class="actions"><button type="submit">Lưu</button><button type="button" class="secondary" data-cancel>Hủy</button></div>';

      main.insertAdjacentHTML(
        'beforeend',
        `<div class="field premise"><label for="premise">Cơ sở</label><output id="premise">${P.esc(D.premise.name)}</output></div>
        <section class="panel" aria-labelledby="stations-title">
          <h2 id="stations-title">Trạm in</h2>
          <p class="muted">Trạm là nơi nhận phiếu bếp, ví dụ Bếp, Nướng, Bar.</p>
          <div class="table-scroll short" tabindex="0" role="region" aria-label="Bảng trạm in">
            <table class="data"><thead><tr><th scope="col">Trạm</th><th scope="col">Máy in</th><th scope="col">Kiểu in phiếu</th><th scope="col">Thao tác</th></tr></thead>
              <tbody id="stations"></tbody></table>
          </div>
          <div id="station-slot"></div>
        </section>
        <section class="panel" aria-labelledby="printers-title">
          <h2 id="printers-title">Máy in</h2>
          <div class="table-scroll short" tabindex="0" role="region" aria-label="Bảng máy in">
            <table class="data"><thead><tr>
              <th scope="col">Tên máy</th><th scope="col">Hãng và mẫu</th><th scope="col">Kết nối</th><th scope="col">Địa chỉ</th>
              <th scope="col" class="num">Giấy</th><th scope="col">Cắt</th><th scope="col">Máy dự phòng</th><th scope="col">Vị trí</th><th scope="col">Thao tác</th>
            </tr></thead><tbody id="printers"></tbody></table>
          </div>
          <div id="printer-slot"></div>
        </section>`,
      );

      const render = () => {
        $('stations').innerHTML = stations
          .map(
            (s) => `<tr><th scope="row">${P.esc(s.name)}</th>
              <td>${s.printer ? P.esc(pname(s.printer)) : '<span class="chip chip-warning">Chưa gán máy in</span>'}</td>
              <td>${MODES[s.mode]}</td>
              <td><button type="button" class="secondary row-action" aria-label="Sửa trạm ${P.esc(s.name)}" data-station="${s.id}">Sửa</button></td></tr>`,
          )
          .join('');
        $('printers').innerHTML = printers
          .map((p) => {
            const f = fault(p.health);
            return `<tr><th scope="row">${P.esc(p.name)}${f ? ` <span class="chip chip-danger" title="${P.esc(f.text)}">Hết giấy</span>` : ''}</th>
              <td>${P.esc([p.brand, p.model].join(' '))}</td><td>Mạng LAN</td><td>${p.ip}:9100</td><td class="num">80 mm</td>
              <td>${CUTS[p.cut]}</td><td>${P.esc(pname(p.backup))}</td><td>${P.esc(p.placement)}</td>
              <td><button type="button" class="secondary row-action" aria-label="Sửa máy ${P.esc(p.name)}" data-printer="${p.id}">Sửa</button></td></tr>`;
          })
          .join('');
        const f = printers.map((p) => [p, fault(p.health)]).find(([, x]) => x);
        $('printer-fault')?.remove();
        if (f)
          $('printers-title').insertAdjacentHTML(
            'afterend',
            `<div role="alert" class="status status-danger" id="printer-fault"><strong>${P.esc(f[0].name)}: máy in hết giấy.</strong>${P.esc((f[1].text.split(' – ')[1] ?? '').replace(/^./, (c) => c.toUpperCase()))}. Phiếu của trạm Nướng đang chờ in.</div>`,
          );
        if (!$('station-slot').firstElementChild) $('station-slot').innerHTML = '<div class="actions"><button type="button" id="add-station">Thêm trạm in</button></div>';
        if (!$('printer-slot').firstElementChild) $('printer-slot').innerHTML = '<div class="actions"><button type="button" id="add-printer">Thêm máy in</button></div>';
      };

      const form = (slot, label, html) => {
        $(slot).innerHTML = `<form class="subform" aria-label="${P.esc(label)}">${html}${buttons}</form>`;
        const f = $(slot).querySelector('form');
        f.addEventListener('submit', (e) => (e.preventDefault(), ($(slot).innerHTML = ''), render(), P.toast('Đã lưu')));
        f.querySelector('[data-cancel]').addEventListener('click', () => (($(slot).innerHTML = ''), render()));
      };
      const field = (id, label, value, extra = '') =>
        `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${P.esc(value ?? '')}" ${extra} /></div>`;
      const stationForm = (s) =>
        form(
          'station-slot',
          s ? `Sửa trạm ${s.name}` : 'Thêm trạm in',
          `<div class="form-grid">
            ${field('sf-name', 'Tên trạm', s?.name, 'required')}
            <div class="field"><label for="sf-printer">Máy in của trạm</label><select id="sf-printer">${opts([['', 'Chưa gán máy in'], ...printers.map((p) => [p.id, p.name])], s?.printer ?? '')}</select></div>
            <div class="field"><label for="sf-mode">Kiểu in phiếu</label><select id="sf-mode" aria-describedby="sf-mode-hint">${opts(Object.entries(MODES), s?.mode ?? 'line')}</select>
              <small id="sf-mode-hint">Mỗi món một phiếu là mặc định; chọn mỗi lần gửi một phiếu nếu trạm muốn gom món.</small></div>
          </div>`,
        );
      const printerForm = (p) =>
        form(
          'printer-slot',
          p ? `Sửa máy ${p.name}` : 'Thêm máy in',
          `<div class="form-grid">
            ${field('pf-name', 'Tên máy in', p?.name, 'required')}
            ${field('pf-brand', 'Hãng', p?.brand)}
            ${field('pf-model', 'Mẫu', p?.model)}
            <div class="field"><label for="pf-conn">Kết nối</label><select id="pf-conn">${opts([['lan', 'Mạng LAN'], ['usb', 'USB']], 'lan')}</select></div>
            <div class="field"><label for="pf-ip">Địa chỉ IP</label><input id="pf-ip" value="${p?.ip ?? ''}" aria-describedby="pf-ip-hint" /><small id="pf-ip-hint">Ví dụ 192.168.1.50. Để trống nếu dùng USB.</small></div>
            ${field('pf-port', 'Cổng', '9100', 'inputmode="numeric"')}
            ${field('pf-paper', 'Khổ giấy (mm)', '80', 'inputmode="numeric"')}
            <div class="field"><label for="pf-cut">Kiểu cắt</label><select id="pf-cut">${opts(Object.entries(CUTS), p?.cut ?? 'full')}</select></div>
            <div class="field"><label for="pf-backup">Máy in dự phòng</label><select id="pf-backup">${opts([['', '(không có)'], ...printers.filter((x) => x !== p).map((x) => [x.id, x.name])], p?.backup ?? '')}</select></div>
            ${field('pf-place', 'Vị trí đặt máy', p?.placement)}
          </div>`,
        );

      render();
      main.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'add-station') stationForm(null);
        else if (b.id === 'add-printer') printerForm(null);
        else if (b.dataset.station) stationForm(stations.find((s) => s.id === b.dataset.station));
        else if (b.dataset.printer) printerForm(printers.find((p) => p.id === b.dataset.printer));
      });
      main.addEventListener('change', (e) => {
        if (e.target.id === 'pf-conn') $('pf-ip').disabled = e.target.value !== 'lan';
      });
    </script>
  </body>
</html>
