<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ánh xạ món sang CukCuk · iOcOrder (prototype)</title>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/proto.css" />
  </head>
  <body>
    <script src="assets/data.js"></script>
    <script src="assets/proto.js"></script>
    <script>
      // /office/cukcuk-map: CukcukMapScreen.tsx. Items without a CukCuk code come first, as the API lists them.
      const main = P.frame({ surface: 'office', user: 'accountant', title: 'Ánh xạ món sang CukCuk', nav: 'cukcukMap' });
      const D = P.D;
      // data.js only has the CukCuk code; the CukCuk name is taken to be the item's name.
      const ckName = (i) => i.name;
      const entries = D.items
        .map((i) => ({ item: i, code: i.cukcuk ?? '', name: i.cukcuk ? ckName(i) : '', unmapped: !i.cukcuk }))
        .sort((a, b) => Number(b.unmapped) - Number(a.unmapped));
      let only = false;

      main.insertAdjacentHTML(
        'beforeend',
        `<div class="field premise"><label for="premise">Cơ sở</label><output id="premise">${P.esc(D.premise.name)}</output></div>
        <section aria-labelledby="cukcuk-map-title">
          <h2 id="cukcuk-map-title">Ánh xạ món sang CukCuk</h2>
          <p class="muted">Mỗi món cần mã và tên CukCuk để nhân viên nhập đúng hóa đơn. Món chưa có sẽ báo "Chưa ánh xạ" trên màn hình nhập.</p>
          <label class="check"><input type="checkbox" id="only" /><span id="only-label"></span></label>
          <p role="status" id="saved"></p>
          <div class="table-scroll">
            <table class="data">
              <thead><tr>
                <th scope="col">Món</th><th scope="col">Mã CukCuk</th><th scope="col">Tên CukCuk</th>
                <th scope="col">Trạng thái</th><th scope="col"><span class="sr-only">Lưu</span></th>
              </tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>`,
      );

      const $ = (id) => document.getElementById(id);
      const render = () => {
        $('only-label').textContent = `Chỉ món chưa ánh xạ (${entries.filter((e) => e.unmapped).length})`;
        $('rows').innerHTML = entries
          .filter((e) => !only || e.unmapped)
          .map((e) => {
            const n = P.esc(e.item.name);
            return `<tr data-code="${e.item.code}">
              <th scope="row">${n} <small class="muted">${e.item.code}</small></th>
              <td><input autocomplete="off" aria-label="Mã CukCuk của ${n}" value="${P.esc(e.code)}" data-f="code" /></td>
              <td><input autocomplete="off" aria-label="Tên CukCuk của ${n}" value="${P.esc(e.name)}" data-f="name" /></td>
              <td><span class="chip ${e.unmapped ? 'chip-warning' : 'chip-ok'}">${e.unmapped ? 'Chưa ánh xạ' : 'Đã ánh xạ'}</span></td>
              <td><button type="button" class="secondary" aria-label="Lưu ánh xạ ${n}"${e.code && e.name ? '' : ' disabled'}>Lưu</button></td>
            </tr>`;
          })
          .join('');
      };
      render();
      $('only').addEventListener('change', (e) => ((only = e.target.checked), render()));
      $('rows').addEventListener('input', (e) => {
        const tr = e.target.closest('tr');
        const [code, name] = [...tr.querySelectorAll('input')].map((i) => i.value.trim());
        tr.querySelector('button').disabled = !(code && name);
      });
      $('rows').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const tr = b.closest('tr');
        const entry = entries.find((x) => x.item.code === tr.dataset.code);
        entry.code = tr.querySelector('[data-f=code]').value.trim();
        entry.name = tr.querySelector('[data-f=name]').value.trim();
        entry.unmapped = false;
        $('saved').textContent = `Đã lưu ánh xạ ${entry.item.name}.`;
        render();
      });
    </script>
  </body>
</html>
